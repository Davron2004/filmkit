<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Splitter</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
    background: #f4f4f6; color: #17181c;
  }
  main {
    width: 380px; padding: 32px; border-radius: 16px; background: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 20px; font-size: 24px; }
  label { display: block; margin-bottom: 14px; }
  label span { display: block; font-size: 13px; font-weight: 600; color: #55565e; margin-bottom: 4px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 18px;
    border: 1px solid #d7d8de; border-radius: 8px; outline-color: #4f6ef7;
  }
  .rows { margin: 18px 0; border-top: 1px solid #ececf1; }
  .row { display: flex; justify-content: space-between; padding: 9px 2px; font-size: 17px; }
  .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  button {
    width: 100%; padding: 11px; font-size: 16px; font-weight: 600; cursor: pointer;
    color: #fff; background: #4f6ef7; border: 0; border-radius: 8px;
  }
  button:hover { background: #3f5ce0; }
</style>
</head>
<body>
<main>
  <h1>Tip Splitter</h1>
  <label><span>Bill</span><input id="bill" type="number" value="100"></label>
  <label><span>Tip %</span><input id="tip" type="number" value="15"></label>
  <label><span>People</span><input id="people" type="number" value="2"></label>
  <div class="rows">
    <div class="row"><span>Tip</span><span id="tip-amt"></span></div>
    <div class="row"><span>Total</span><span id="total"></span></div>
    <div class="row"><span>Per person</span><span id="per-person"></span></div>
  </div>
  <button id="reset">Reset</button>
</main>
<script>
  const bill = document.getElementById('bill');
  const tip = document.getElementById('tip');
  const people = document.getElementById('people');
  const DEFAULTS = () => ({ bill: '100', tip: '15', people: '2' });

  function compute() {
    const b = Number(bill.value) || 0;
    const t = Number(tip.value) || 0;
    const p = Math.max(1, Number(people.value) || 1);
    const tipAmt = (b * t) / 100;
    const total = b + tipAmt;
    document.getElementById('tip-amt').textContent = '$' + tipAmt.toFixed(2);
    document.getElementById('total').textContent = '$' + total.toFixed(2);
    document.getElementById('per-person').textContent = '$' + (total / p).toFixed(2);
  }

  function reset() {
    const d = DEFAULTS();
    bill.value = d.bill;
    tip.value = d.tip;
    people.value = d.people;
    compute();
  }

  for (const el of [bill, tip, people]) el.addEventListener('input', compute);
  document.getElementById('reset').addEventListener('click', reset);
  compute();
</script>
</body>
</html>
